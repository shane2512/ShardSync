services:
  - type: web
    name: shardsync-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # ── Testnet ──────────────────────────────────────────────────────
      - key: TATUM_SUI_RPC_URL
        value: https://sui-testnet.gateway.tatum.io/
      - key: WALRUS_PUBLISHER_URL
        value: https://publisher.walrus-testnet.walrus.space
      - key: WALRUS_AGGREGATOR_URL
        value: https://aggregator.walrus-testnet.walrus.space
      - key: SUI_NETWORK
        value: testnet
      # ── Mainnet ───────────────────────────────────────────────────────
      - key: TATUM_SUI_MAINNET_RPC_URL
        value: https://sui-mainnet.gateway.tatum.io/
      - key: WALRUS_MAINNET_PUBLISHER_URL
        value: https://walrus-mainnet-publisher-1.staketab.org
      - key: WALRUS_MAINNET_AGGREGATOR_URL
        value: https://aggregator.walrus-mainnet.walrus.space
      - key: SHARDSYNC_MAINNET_PACKAGE_ID
        value: "0x64bea6270d379cb1e9e75bab769fa671d2421f072572f82e807dee6e94c604d4"
      # ── Testnet package ID (public, safe to commit) ─────────────────────
      - key: SHARDSYNC_PACKAGE_ID
        value: "0x17104a3b9595ee7514a188628bf556a4fe7d39de242ff9b869129ab4e9531177"
      # ── Secrets: set these in Render dashboard, NOT here ─────────────────
      # TATUM_API_KEY      ← required, add in Render dashboard
      # FRONTEND_URL       ← your Vercel URL e.g. https://shardsync.vercel.app
